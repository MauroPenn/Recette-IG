<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f7a4a">
  <meta name="description" content="Bibliothèque personnelle de recettes IG bas et protéinées.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Recettes IG bas & protéinées</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">Ma bibliothèque</div>
        <h1>Recettes IG bas & protéinées</h1>
      </div>
      <button id="installBtn" class="ghost-btn hidden">Installer</button>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav" aria-label="Navigation">
      <button class="nav-btn active" data-view="home"><span>⌂</span><small>Accueil</small></button>
      <button class="nav-btn" data-view="recipes"><span>▤</span><small>Recettes</small></button>
      <button class="nav-btn" data-view="favorites"><span>♡</span><small>Favoris</small></button>
    </nav>
  </div>

  <dialog id="photoDialog">
    <form method="dialog" class="dialog-card">
      <h3>Photo de la recette</h3>
      <p>Tu peux choisir une photo existante ou prendre une photo avec ton téléphone.</p>
      <input id="photoInput" type="file" accept="image/*" capture="environment">
      <div class="dialog-actions">
        <button value="cancel" class="ghost-btn">Annuler</button>
        <button id="removePhotoBtn" type="button" class="danger-btn">Retirer la photo</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
