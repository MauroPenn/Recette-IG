<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6d4f">
  <meta name="description" content="Ma bibliothèque personnelle : cuisine IG bas, musculation et étirements.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./pectoraux-v1.css?v=3">
  <link rel="stylesheet" href="./dos-v1.css?v=1">
  <link rel="stylesheet" href="./epaules-v1.css?v=1">
  <link rel="stylesheet" href="./biceps-v2.css?v=1">
  <link rel="stylesheet" href="./triceps-v1.css?v=2">
  <title>Ma Bibliothèque</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand-wrap" id="brandHome" role="button" tabindex="0" aria-label="Revenir aux univers">
        <div class="brand-mark" id="brandMark" aria-hidden="true">MB</div>
        <div>
          <div class="eyebrow" id="brandEyebrow">Ma bibliothèque</div>
          <h1 id="brandTitle">Mes univers</h1>
        </div>
      </div>
      <button id="installBtn" class="ghost-btn install-btn hidden">Installer</button>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav hidden" id="bottomNav" aria-label="Navigation cuisine">
      <button class="nav-btn" data-view="hub"><span aria-hidden="true">◫</span><small>Univers</small></button>
      <button class="nav-btn active" data-view="home"><span aria-hidden="true">⌂</span><small>Accueil</small></button>
      <button class="nav-btn" data-view="recipes"><span aria-hidden="true">▤</span><small>Recettes</small></button>
      <button class="nav-btn" data-view="favorites"><span aria-hidden="true">♡</span><small>Favoris</small></button>
    </nav>
  </div>

  <dialog id="photoDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-kicker">Photo personnelle</div>
      <h3>Photo de la recette</h3>
      <p>Choisis une photo de ta galerie ou prends directement ton plat en photo.</p>
      <input id="photoInput" type="file" accept="image/*" capture="environment">
      <div class="dialog-actions">
        <button value="cancel" class="ghost-btn">Annuler</button>
        <button id="removePhotoBtn" type="button" class="danger-btn">Retirer la photo</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
  <script src="./pectoraux-v1.js?v=3"></script>
  <script src="./dos-v1.js?v=2"></script>
  <script src="./epaules-v1.js?v=1"></script>
  <script src="./biceps-v2.js?v=1"></script>
  <script src="./triceps-v1.js?v=2"></script>
</body>
</html>
