name: Refaire les bandeaux Triceps
on:
  push:
    paths:
      - triceps-rebuild-v5.py
      - .github/workflows/triceps-v5-build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  correction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer outils image
        run: python -m pip install Pillow opencv-python-headless numpy
      - name: Reconstruire les images depuis les 10 originaux
        run: python triceps-rebuild-v5.py
      - name: Enregistrer les nouveaux bandeaux
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add triceps-*-orange-v5.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Triceps V5 : images sans cadres blancs'
            git push
          fi
