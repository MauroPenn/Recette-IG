name: Optimisation des 90 recettes PNG restantes

on:
  push:
    paths:
      - '.github/workflows/optimisation-90-recettes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimisation-complete-recettes
  cancel-in-progress: false

jobs:
  optimiser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Recuperer les fichiers de l'application
        uses: actions/checkout@v4

      - name: Installer le convertisseur d'images
        run: python -m pip install --quiet Pillow

      - name: Recuperer la photo R125 manquante depuis l'historique GitHub
        shell: bash
        run: |
          set -euo pipefail
          test ! -e recette-r125-roti-porc-pommes-terre-v3.png
          curl --fail --location --silent --show-error --retry 3 \
            --output recette-r125-roti-porc-pommes-terre-v3.png \
            'https://raw.githubusercontent.com/MauroPenn/Recette-IG/b675f4cca0aab723d7e881667842736c359a2e1e/recette-r125-roti-porc-pommes-terre-v3.png'
          SHA=$(git hash-object recette-r125-roti-porc-pommes-terre-v3.png)
          test "$SHA" = '6c120dedd7a82c497995dc22d46dd533836ed994' || {
            echo 'La photo restauree ne correspond pas a l original, arret de securite.'
            exit 1
          }

      - name: Convertir les 90 PNG et reparer R125, puis verifier les references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import json
          import re

          app_file = Path('app.js')
          sw_file = Path('sw.js')
          data_file = Path('data.json')
          app = app_file.read_text(encoding='utf-8')
          sw = sw_file.read_text(encoding='utf-8')
          data = data_file.read_text(encoding='utf-8')
          cache_old = 'const CACHE="ma-bibliotheque-v80";'
          cache_new = 'const CACHE="ma-bibliotheque-v81";'
          if sw.count(cache_old) != 1:
              raise RuntimeError('Version du cache inattendue : aucune modification effectuee')

          missing_from_before = Path('recette-r125-roti-porc-pommes-terre-v3.png')
          if not missing_from_before.is_file():
              raise RuntimeError('Photo R125 non recuperee, abandon')

          sources = sorted(Path('.').glob('recette-*.png'))
          if len(sources) != 91:
              raise RuntimeError(f'91 photos attendues (90 presentes + R125 restauree), {len(sources)} trouvees. Abandon.')

          # Valider tous les fichiers et leurs references avant de modifier le depot.
          for png in sources:
              webp = png.with_suffix('.webp')
              if webp.exists():
                  raise RuntimeError(f'Conversion deja presente : {webp}')
              if app.count(png.name) != 1 or sw.count(png.name) != 1:
                  raise RuntimeError(f'References absentes ou multiples : {png.name}')
              if png.name in data:
                  raise RuntimeError(f'Reference dans data.json a corriger : {png.name}')
              if png.stat().st_size == 0:
                  raise RuntimeError(f'PNG vide : {png.name}')

          initial_bytes = 0
          final_bytes = 0
          for png in sources:
              webp = png.with_suffix('.webp')
              with Image.open(png) as original:
                  image = ImageOps.exif_transpose(original)
                  transparent = ('A' in image.getbands()) or ('transparency' in image.info)
                  image = image.convert('RGBA' if transparent else 'RGB')
                  image.save(webp, format='WEBP', quality=80, method=6)
              with Image.open(webp) as check:
                  if check.format != 'WEBP':
                      raise RuntimeError(f'Image WebP invalide : {webp}')
                  check.verify()
              if webp.stat().st_size >= png.stat().st_size:
                  raise RuntimeError(f'Image non allegee : {png.name}')
              initial_bytes += png.stat().st_size
              final_bytes += webp.stat().st_size
              app = app.replace(png.name, webp.name)
              sw = sw.replace(png.name, webp.name)
              print(f'{png.name}: {png.stat().st_size:,} -> {webp.stat().st_size:,} octets')

          if any(png.name in app or png.name in sw for png in sources):
              raise RuntimeError('Certaines anciennes references PNG subsistent, abandon')
          sw = sw.replace(cache_old, cache_new, 1)
          if sw.count(cache_new) != 1:
              raise RuntimeError('Version du cache incorrecte')

          # Verifier que les images attendues par l'application seront disponibles
          # une fois les anciennes images effacees.
          assets_match = re.search(r'const ASSETS=(\[[\s\S]*?\]);', sw)
          if not assets_match:
              raise RuntimeError('Liste des ressources du service worker introuvable')
          assets = json.loads(assets_match.group(1))
          old_set = {p.name for p in sources}
          for resource in assets:
              relative = resource.removeprefix('./')
              if not relative:
                  continue
              if relative in old_set:
                  raise RuntimeError(f'Ancienne reference encore en cache : {relative}')
              if not Path(relative).is_file():
                  raise RuntimeError(f'Fichier attendu par le cache introuvable : {relative}')

          # Tous les controles sont passes : on peut finaliser les modifications.
          app_file.write_text(app, encoding='utf-8')
          sw_file.write_text(sw, encoding='utf-8')
          for png in sources:
              png.unlink()
          if list(Path('.').glob('recette-*.png')):
              raise RuntimeError('Il reste des PNG de recette : abandon')

          print(f'BILAN : 90 PNG remplaces + 1 photo manquante restauree.')
          print(f'Original : {initial_bytes / 1_000_000:.2f} Mo ; WebP : {final_bytes / 1_000_000:.2f} Mo')
          print(f'Gain : {(initial_bytes - final_bytes) / 1_000_000:.2f} Mo, soit {(1-final_bytes/initial_bytes)*100:.1f} %')
          print('Les 90 anciens PNG ont ete retires ; les fichiers WebP et le cache sont a jour.')
          PY

      - name: Enregistrer les images et les modifications sur GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app.js sw.js
          git add -A -- 'recette-*.png' 'recette-*.webp'
          git diff --cached --stat
          git diff --cached --quiet && { echo 'Aucune modification a enregistrer.'; exit 1; }
          git commit -m "Optimiser les 90 recettes restantes et restaurer la photo R125"
          git push origin HEAD:main
